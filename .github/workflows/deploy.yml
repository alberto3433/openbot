name: Deploy to App Runner

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-apprunner
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: orderbot
  APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:us-east-1:090877040118:service/orderbot/ef431a5aa0a544b7975a064669736333

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to App Runner
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(aws apprunner describe-service --service-arn $APP_RUNNER_SERVICE_ARN --query 'Service.Status' --output text)
            echo "Attempt $i: Service status is $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              aws apprunner start-deployment --service-arn $APP_RUNNER_SERVICE_ARN
              echo "Deployment started."
              exit 0
            fi
            echo "Service not in RUNNING state, waiting 30s..."
            sleep 30
          done
          echo "Service did not reach RUNNING state after 5 attempts."
          exit 1
